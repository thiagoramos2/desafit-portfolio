<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-72x72.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="DietBet - Plataforma de desafios fitness com apostas reais" />
    <!-- Meta tag para cookies -->
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()" />
    <link rel="manifest" href="/manifest.json" />
    <title>DietBet - Desafios Fitness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/service-worker.js', {
              scope: '/',
              type: 'classic'
            });
            console.log('Service Worker registrado com sucesso:', registration.scope);
          } catch (error) {
            console.error('Erro ao registrar Service Worker:', error);
          }
        });
      }
    </script>
  </body>
</html>
